<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cash — учёт и прогноз</title>
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Личный учёт финансов с прогнозом денежного потока">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Cash</div>
    <div class="total">
      <span>Итого</span>
      <strong id="totalValue">0 ₽</strong>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="accounts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>
      <span>Счета</span>
    </button>
    <button data-tab="transactions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h13l-3-3"/><path d="M20 17H7l3 3"/></svg>
      <span>Операции</span>
    </button>
    <button data-tab="plans">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 11h18"/><path d="M8 15h3"/></svg>
      <span>План</span>
    </button>
    <button data-tab="forecast">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span>Прогноз</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.06-.4.1-.8.1-1.2z"/></svg>
      <span>Ещё</span>
    </button>
  </nav>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>
<script src="core.js"></script>
<script src="sync.js"></script>
<script src="ui.js"></script>
</body>
</html>
